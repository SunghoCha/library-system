server:
  port: 9003

spring:
  datasource:
    url: jdbc:mysql://localhost:13309/memberdb?sslMode=DISABLED&rewriteBatchedStatements=true&serverTimezone=Asia/Seoul
    username: ${MYSQL_MEMBER_USER}
    password: ${MYSQL_MEMBER_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  flyway:
    enabled: false

  kafka:
    bootstrap-servers: kafka:9092
    listener:
      auto-startup: false

logging:
  level:
    org.hibernate.SQL: debug