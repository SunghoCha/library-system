server:
  port: 8080

spring:
  application:
    name: book-loan-service
  
  profiles:
    active: local

  # .env 파일에서 환경 변수를 가져오는 설정 (공통으로 사용)
  config:
    import: optional:file:.env[.properties]

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: create # 추후 변경
    properties:
      hibernate:
        format_sql: true

  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: loan-service-bookinfo-replica
      auto-offset-reset: earliest
    listener:
      auto-startup: false # 기본적으로 리스너를 자동 시작하지 않게 일단 해뒀음. 추후 변경




# 커스텀 설정
app:
  kafka:
    source-token: book-loan
    topic-loan-requested: book-loan.requested
    topic-loan-returned:  book-loan.returned
    topic-catalog-changed: book-catalog.changed
    group-loan-requested: bookloan.loan-requested
    group-catalog-replica: bookloan-category-changed-replica
