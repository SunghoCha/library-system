server:
  port: 9004

spring:
  datasource:
    url: jdbc:mysql://localhost:13305/paymentdb?sslMode=DISABLED&rewriteBatchedStatements=true&serverTimezone=Asia/Seoul
    username: ${MYSQL_PAYMENT_USER}
    password: ${MYSQL_PAYMENT_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  flyway:
    enabled: false

  kafka:
    bootstrap-servers: kafka:9092
    listener:
      auto-startup: false

logging:
  level:
    org.hibernate.SQL: debug