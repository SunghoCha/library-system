server:
  port: 9002

spring:
  datasource:
    url: jdbc:mysql://localhost:13308/inventorydb?sslMode=DISABLED&rewriteBatchedStatements=true&serverTimezone=Asia/Seoul
    username: ${MYSQL_INVENTORY_USER}
    password: ${MYSQL_INVENTORY_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  flyway:
    enabled: false

  kafka:
    bootstrap-servers: kafka:9092
    listener:
      auto-startup: false

logging:
  level:
    org.hibernate.SQL: debug

