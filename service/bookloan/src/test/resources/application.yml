spring:
  datasource:
    url: jdbc:tc:mysql:8.3.0:///testdb?useAffectedRows=true
    driver-class-name: org.testcontainers.jdbc.ContainerDatabaseDriver
  jpa:
    hibernate:
      ddl-auto: create
    open-in-view: false
  kafka:
    # 임베디드 카프카 브로커 주입(EmbeddedKafka가 노출하는 값)
    bootstrap-servers: ${spring.embedded.kafka.brokers}
    consumer:
      # 테스트 재실행 시 가장 앞에서부터 읽기
      auto-offset-reset: earliest


app:
  kafka:
    enabled: true
    source-token: book-loan

    # commands
    topic-member-check: member.check
    topic-inventory-reserve: inventory.reserve
    topic-point-charge: point.charge
    topic-point-refund: point.refund
    topic-shipping-schedule: shipping.schedule
    topic-inventory-release: inventory.release

    # single reply channel
    topic-saga-replies: loan.saga.replies

    # catalog
    topic-catalog-changed: book-catalog.changed

    # groups
    group-saga-replies: bookloan-saga-replies
    group-catalog-replica: bookloan-category-changed-replica


# (1) 당장의 abbreviate 오류 해결(임시)

  inbox:
    processing:
      error-max-length: 255

# (2) 근본 원인(빈 로드 실패)을 찾기 위한 디버그 로그
logging:
  level:
    root: INFO
    msa.bookloan: DEBUG
    msa.bookloan.application.saga: DEBUG
    msa.bookloan.application.saga.listener: DEBUG
    msa.bookloan.adapter.out.persistence.outbox: DEBUG  # <-- OutboxClaimerService 포함
    msa.bookloan.adapter.out.persistence.outbox.repository: DEBUG  # (선택) 쿼리 로그용
    org.hibernate.SQL: DEBUG              # (선택) 실제 SELECT/UPDATE 보려면
    org.hibernate.orm.jdbc.bind: TRACE    # (선택) 바인딩 파라미터 확인